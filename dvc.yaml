stages:
  data_ingestion:
    cmd: python src/data_ingestion.py
    deps:
      - src/data_ingestion.py
    outs:
      - data/raw/data.csv

  data_validation:
    cmd: python src/data_validation.py
    deps:
      - src/data_ingestion.py
    outs:
      - data/validation/train.csv
      - data/validation/test.csv

  data_transformation:
    cmd: python src/data_transformation.py
    deps:
      - data/raw/data_validation
    outs:
      - data/artifacts/preprocessed.pkl

  model_training:
    cmd: python src/model_trainer.py
    deps:
      - src/data_transformation.py
      - data/validation/train.csv
    outs:
      - data/artifacts/model.pkl
