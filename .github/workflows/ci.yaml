name: Diamond Price CI-CD Pipeline

on:
  push:
    branches:
      - main
      - develop

  pull_request:
    branches:
      - main
      - develop

permissions:
  contents: write

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12"]

    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with: # supply configuration to action
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements.txt

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip install "dvc[azure]"

      # 4. Configure Azure credentials for DVC
      - name: Configure DVC Azure authentication
        env:
          DVC_REMOTE_URL: ${{ vars.DVC_REMOTE_URL }}
          AZURE_STORAGE_STRING: ${{ secrets.AZURE_STORAGE_STRING }}
        run: |
          dvc remote add --local --force -d azure_storage "$DVC_REMOTE_URL"
          dvc remote modify --local azure_storage connection_string "$AZURE_STORAGE_STRING"
      
      - name: Pull existing DVC artifacts
        run: dvc pull -v

      - name: Run DVC pipeline
        run: dvc repro

      - name: Check DVC remote status
        run: dvc status --cloud

      - name: Push updated DVC artifacts
        run: dvc push -v

      - name: Configure git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Add changes to Git
        run: |
          git add .

          if ! git diff --cached --quiet; then
            git commit -m "Update DVC pipeline metadata"
            git push origin HEAD:main
          else
            echo "No changes to dvc.lock"
          fi

      - name: Check code quality
        run: ruff check . # check code quality - linting

      - name: Check code formatting
        run: ruff format --check .

      - name: run unit tests. # pytest automatically run pyproject.toml
        run: python -m pytest tests/unit -v # get address from pyproject.toml

