name: Diamond Price CI-CD Pipeline

name: ML Project CI

on:                          # trigger when to start CI
  push:
    branches:
      - main
      - develop

  pull_request:
    branches:
      - main
      - develop

permissions:       # CI will have read and test permission not change
  contents: read

concurrency:      # when new run starts cancel old run
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:                 # tasks GitHub action will execute
  test:                # job identifier name
    name: Test Python ${{ matrix.python-version }}.  # job display name
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false    # if one matrix fails the other will get finished not stop
      matrix:
        python-version: ["3.11", "3.12"]

    timeout-minutes: 15      # limits the job execution time

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4.   # check out repository so runner gets files

      - name: Set up Python
        uses: actions/setup-python@v5
        with:               # supply configuration to action
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements.txt

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Check code quality
        run: ruff check .       # check code quality - linting

      - name: Check code formatting
        run: ruff format --check .

      - name: run unit tests.   # pytest automatically run pyproject.toml
        run: python -m pytest tests/unit -v  # get address from pyproject.toml

